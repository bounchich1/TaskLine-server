name: max-support

x-server: &server
  image: max-support-server:local
  build:
    context: .
    args:
      APP_VERSION: local
  restart: unless-stopped
  environment:
    NODE_ENV: development
    HOST: 0.0.0.0
    PORT: '3000'
    GATEWAY_PORT: '3001'
    TRUST_PROXY_HOPS: '1'
    PUBLIC_URL: http://localhost:${WEB_PORT:-8080}
    APP_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ORG_NAME: ${ORG_NAME:-Служба поддержки}
    ORG_TIMEZONE: ${ORG_TIMEZONE:-Asia/Krasnoyarsk}
    DATABASE_URL: postgres://support:${POSTGRES_PASSWORD:-support-local}@postgres:5432/support
    REDIS_URL: redis://redis:6379
    GATEWAY_URL: http://gateway:3001
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    GATEWAY_SECRET: ${GATEWAY_SECRET:-local-gateway-secret-not-for-production}
    MAX_MODE: ${MAX_MODE:-mock}
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-local-webhook-secret-not-for-production}
    POLICY_VERSION: ${POLICY_VERSION:-local-1}
    POLICY_URL: ${POLICY_URL:-http://localhost:8080/legal/}
    ALTERNATIVE_CONTACT: ${ALTERNATIVE_CONTACT:-Обратитесь в службу поддержки вашей организации.}
    AI_ENABLED: ${AI_ENABLED:-true}
    AI_MODE: ${AI_MODE:-mock}
    AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-}
    MEMORY_ENABLED: 'false'
    AGENTMEMORY_SECRET: local-agentmemory-secret-not-for-production
    STORAGE_MODE: local
    STORAGE_PATH: /data/attachments
    SCANNER_MODE: mock
    DEMO_ROLE_CODES: ${DEMO_ROLE_CODES:-support:LOCAL-SUPPORT-CODE,supervisor:LOCAL-SUPERVISOR-CODE,admin:LOCAL-ADMIN-CODE}
    DEV_AUTH_ENABLED: 'true'
  volumes: [attachments:/data/attachments]

x-one-shot: &one-shot
  <<: *server
  restart: 'no'
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support-local}
      POSTGRES_DB: support
    ports: ['127.0.0.1:${POSTGRES_PORT:-55432}:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U support -d support']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  files-init:
    image: busybox:1.36.1
    user: '0:0'
    volumes: [attachments:/data/attachments]
    command: ['chown', '1000:1000', '/data/attachments']

  migrate:
    <<: *one-shot
    command: ['node', 'dist/cli.js', 'migrate']

  seed:
    <<: *one-shot
    command: ['node', 'dist/cli.js', 'seed-test-data']
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *server
    command: ['node', 'dist/main.js', 'api']
    depends_on: &server-deps
      migrate:
        condition: service_completed_successfully
      files-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *server
    command: ['node', 'dist/main.js', 'worker']
    depends_on: *server-deps

  gateway:
    <<: *server
    command: ['node', 'dist/main.js', 'gateway']
    depends_on: *server-deps
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/health']
      interval: 5s
      timeout: 3s
      retries: 12

  mini-app:
    image: max-support-mini-app:local
    build:
      context: ${MINI_APP_SOURCE:-https://github.com/bounchich1/TaskLine-mini-app.git#075eb8f4f8d75727cd634b0b75b471233ed9ecd0}
      args:
        APP_VERSION: local
    restart: unless-stopped

  web:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['${WEB_PORT:-8080}:80']
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      api:
        condition: service_healthy
      mini-app:
        condition: service_started

  clamav:
    image: clamav/clamav:1.4.3_base
    profiles: [files]
    ports: ['127.0.0.1:3310:3310']
    volumes: [clamav-data:/var/lib/clamav]

  s3:
    image: chrislusf/seaweedfs:4.47
    profiles: [s3]
    command: ['mini', '-dir=/data', '-master.telemetry=false']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports: ['127.0.0.1:9000:8333']
    volumes: [object-data:/data]

  memory-init:
    image: busybox:1.36.1
    profiles: [memory]
    user: '0:0'
    volumes: [memory-engine-data:/engine, memory-index-data:/index]
    command: ['sh', '-c', 'chown 65532:65532 /engine /index && chmod 750 /engine /index']

  memory-engine:
    image: iiidev/iii:0.11.2
    profiles: [memory]
    user: '65532:65532'
    depends_on:
      memory-init:
        condition: service_completed_successfully
    ports: ['127.0.0.1:3111:3111']
    volumes:
      - memory-engine-data:/data
      - ./infra/agentmemory/engine.yaml:/app/config.yaml:ro

  memory:
    build: ./infra/agentmemory
    profiles: [memory]
    depends_on: [memory-engine]
    environment:
      AGENTMEMORY_SECRET: ${AGENTMEMORY_SECRET}
      AGENT_ID: support-knowledge
      AGENTMEMORY_AGENT_SCOPE: isolated
      AGENTMEMORY_AUTO_COMPRESS: 'false'
      CONSOLIDATION_ENABLED: 'false'
      GRAPH_EXTRACTION_ENABLED: 'false'
      LOG_LEVEL: error
    volumes: [memory-index-data:/data]

configs:
  caddyfile:
    content: |
      :80 {
        @api path /v1/* /download/* /webhooks/* /health/* /openapi.yaml
        handle @api {
          reverse_proxy api:3000
        }
        handle {
          reverse_proxy mini-app:8080
        }
      }

volumes:
  postgres-data:
  redis-data:
  attachments:
  clamav-data:
  object-data:
  memory-engine-data:
  memory-index-data:
