name: max-support
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init}
      POSTGRES_DB: support
    ports: ['127.0.0.1:${POSTGRES_PORT:-55432}:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U support -d support']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:1.4.3_base
    profiles: [files]
    ports: ['127.0.0.1:3310:3310']
    volumes: [clamav-data:/var/lib/clamav]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [s3]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [object-data:/data]
  memory-init:
    image: busybox:1.36.1
    profiles: [memory]
    user: '0:0'
    volumes: [memory-engine-data:/engine, memory-index-data:/index]
    command: ['sh', '-c', 'chown 65532:65532 /engine /index && chmod 750 /engine /index']
  memory-engine:
    image: iiidev/iii:0.11.2
    profiles: [memory]
    user: '65532:65532'
    depends_on:
      memory-init:
        condition: service_completed_successfully
    ports: ['127.0.0.1:3111:3111']
    volumes:
      - memory-engine-data:/data
      - ./infra/agentmemory/engine.yaml:/app/config.yaml:ro
  memory:
    build: ./infra/agentmemory
    profiles: [memory]
    depends_on: [memory-engine]
    environment:
      AGENTMEMORY_SECRET: ${AGENTMEMORY_SECRET}
      AGENT_ID: support-knowledge
      AGENTMEMORY_AGENT_SCOPE: isolated
      AGENTMEMORY_AUTO_COMPRESS: 'false'
      CONSOLIDATION_ENABLED: 'false'
      GRAPH_EXTRACTION_ENABLED: 'false'
      LOG_LEVEL: error
    volumes: [memory-index-data:/data]
volumes:
  postgres-data:
  redis-data:
  clamav-data:
  object-data:
  memory-engine-data:
  memory-index-data:
