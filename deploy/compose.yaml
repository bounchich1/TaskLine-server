name: max-support

x-app: &app
  image: ${SERVER_IMAGE:?set SERVER_IMAGE in .env}:${SERVER_TAG:?set SERVER_TAG in .env}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  env_file: .env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3000'
    GATEWAY_PORT: '3001'
    TRUST_PROXY_HOPS: '1'
    PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
    APP_ORIGIN: https://${DOMAIN}
    DATABASE_URL: postgres://support:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/support
    REDIS_URL: redis://redis:6379
    GATEWAY_URL: http://gateway:3001
    AGENTMEMORY_URL: http://memory-engine:3111
    STORAGE_MODE: s3
    SCANNER_MODE: clamav
    CLAMAV_HOST: clamav
    CLAMAV_PORT: '3310'
    DEV_AUTH_ENABLED: 'false'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, mini-app]

  mini-app:
    image: ${MINI_APP_IMAGE:?set MINI_APP_IMAGE in .env}:${MINI_APP_TAG:?set MINI_APP_TAG in .env}
    restart: unless-stopped
    read_only: true
    tmpfs: [/config, /data]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 6

  api:
    <<: *app
    command: ['node', 'dist/main.js', 'api']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ['node', 'dist/main.js', 'worker']

  gateway:
    <<: *app
    command: ['node', 'dist/main.js', 'gateway']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: support
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U support -d support']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]

  s3:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: ['mini', '-dir=/data', '-master.telemetry=false']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes: [object-data:/data]

  memory-init:
    image: busybox:1.36.1
    user: '0:0'
    volumes: [memory-engine-data:/engine, memory-index-data:/index]
    command: ['sh', '-c', 'chown 65532:65532 /engine /index && chmod 750 /engine /index']

  memory-engine:
    image: iiidev/iii:0.11.2
    restart: unless-stopped
    user: '65532:65532'
    depends_on:
      memory-init:
        condition: service_completed_successfully
    volumes:
      - memory-engine-data:/data
      - ../infra/agentmemory/engine.yaml:/app/config.yaml:ro

  memory:
    image: max-support-agentmemory:0.9.29
    build: ../infra/agentmemory
    restart: unless-stopped
    depends_on: [memory-engine]
    environment:
      AGENTMEMORY_SECRET: ${AGENTMEMORY_SECRET:?set AGENTMEMORY_SECRET in .env}
      AGENT_ID: support-knowledge
      AGENTMEMORY_AGENT_SCOPE: isolated
      AGENTMEMORY_AUTO_COMPRESS: 'false'
      CONSOLIDATION_ENABLED: 'false'
      GRAPH_EXTRACTION_ENABLED: 'false'
      LOG_LEVEL: error
    volumes: [memory-index-data:/data]

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: '1400'

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  clamav-data:
  object-data:
  memory-engine-data:
  memory-index-data:
